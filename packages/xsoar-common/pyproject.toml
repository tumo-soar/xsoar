[project]
name = "xsoar-common"
version = "0.1.0"
description = "Shared infrastructure for X SOAR Python services: RabbitMQ, database, outbox, worker runtime."
requires-python = ">=3.12"
dependencies = [
    "xsoar-contracts",
    "aio-pika>=9.5,<10",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic>=2.7,<3",
]

[tool.uv.sources]
xsoar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
