[project]
name = "xsoar-collector"
version = "0.1.0"
description = "X SOAR collector: accepts logs over HTTP and publishes alert.created."
requires-python = ">=3.12"
dependencies = [
    "xsoar-common",
    "xsoar-contracts",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[tool.uv.sources]
xsoar-common = { workspace = true }
xsoar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
